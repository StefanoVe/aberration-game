<div
  class="w-full h-screen p-2 relative overflow-hidden flex items-center justify-start flex-col"
>
  <h2 class="text-4xl font-bold mb-4">{{playerName}}</h2>

  <div class="flex w-full">
    <svotao-liquid-glass
      type="host"
      containerClass="space-y-2 !text-black flex flex-col "
    >
      <svotao-liquid-glass
        type="item"
        selectionType="host"
        [selected]="hasMesage"
        (click)="onMessageClick()"
        containerClass="flex items-center justify-center  size-12 cursor-pointer !text-black"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="1.5"
          stroke="currentColor"
          class="size-12"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M12 7.5h1.5m-1.5 3h1.5m-7.5 3h7.5m-7.5 3h7.5m3-9h3.375c.621 0 1.125.504 1.125 1.125V18a2.25 2.25 0 0 1-2.25 2.25M16.5 7.5V18a2.25 2.25 0 0 0 2.25 2.25M16.5 7.5V4.875c0-.621-.504-1.125-1.125-1.125H4.125C3.504 3.75 3 4.254 3 4.875V18a2.25 2.25 0 0 0 2.25 2.25h13.5M6 7.5h3v3H6v-3Z"
          />
        </svg>
      </svotao-liquid-glass>
      <svotao-liquid-glass
        type="item"
        selectionType="host"
        [selected]="hasSlime"
        (click)="onSlimeClick()"
        containerClass="flex items-center justify-center size-12 cursor-pointer !text-black text-3xl hue-rotate-[260deg]"
      >
        💦
      </svotao-liquid-glass>
    </svotao-liquid-glass>
  </div>
  <div
    class="w-full h-screen fixed top-0 left-0 bg-center pointer-events-none rotate-12 bg-repeat scale-150 -z-1 opacity-80"
    style="background-size: 4rem"
    [style.background-image]="backgroundImage"
  ></div>
</div>
